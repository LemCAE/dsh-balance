# dsh-balance bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); install with
# `dsh plugin --profile web add @lemcae/dsh-balance`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (balance fetch, consumption fold, command, tool), and
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/@lemcae/dsh-balance/client.js) load
# in the web GUI.
- insert:
    - id: dsh-balance
      name: '@lemcae/dsh-balance'

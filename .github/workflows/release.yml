name: Release

# Tag-triggered publish pipeline: pushing a vX.Y.Z tag is the single release
# switch. The workflow verifies the package version equals the tag version
# (the tag is the version source of truth), runs the full gate, publishes to
# npm, and creates the GitHub Release.
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# One-time prerequisites:
#   1. npm account "lemcae" (owns the @lemcae scope).
#   2. Publish 0.1.0 once from a local machine (`npm login` then
#      `pnpm publish --access public --no-git-checks`) so the package exists.
#   3. On npmjs.com → package settings → Trusted Publisher, allow GitHub
#      LemCAE/dsh-balance with workflow file release.yml.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for npm trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No explicit version: package.json's packageManager field is the
        # single source of truth (pnpm@11.7.0); a fixed version here plus that
        # field makes the action fail with ERR_PNPM_BAD_PM_VERSION.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify package version matches the tag
        run: node scripts/verify-version.mjs "${{ steps.tag.outputs.version }}"

      # The npm CLI auto-detects the GitHub Actions OIDC environment when the
      # id-token permission is granted; provenance attestations are generated
      # automatically. No tokens or secrets involved.
      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --registry=https://registry.npmjs.org/ --tag latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "dsh-balance $GITHUB_REF_NAME"
